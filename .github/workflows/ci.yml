name: ci

# App-level gate. The verification kernel is the published @ar.io/proof npm
# package (its own conformance gate lives in ar-io-proof); CI here typechecks,
# runs the app + WASM-agreement suite, and builds the deployable bundle.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - name: App + WASM-agreement tests
        run: npm run test
      - run: npm run build
