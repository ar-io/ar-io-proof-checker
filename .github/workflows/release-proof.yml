# Publishes packages/proof (@ar.io/proof) to npm via OIDC trusted publishing —
# no long-lived npm tokens anywhere (the npm mirror of ar-io-proof's PyPI
# Trusted-Publishing flow).
#
# npmjs.com side (one-time, package settings for @ar.io/proof →
# "Trusted Publisher" → GitHub Actions):
#   organization: ar-io
#   repository:   ar-io-proof-checker
#   workflow:     release-proof.yml      (filename must match exactly)
#   environment:  (leave blank)
#
# Real publish: push a `proof-vX.Y.Z` tag whose version matches
# packages/proof/package.json (guard step enforces it).
# Dry-run: workflow_dispatch — runs the ENTIRE path including
# `npm publish --dry-run`. Lesson from the v1.2.0 cosign failure: a dry-run
# that skips the publish step validates nothing.

name: release-proof

on:
  push:
    tags: ['proof-v*.*.*']
  workflow_dispatch: # full dry-run: build, test, pack — publishes nothing

permissions:
  contents: read
  id-token: write # npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Pin npm to a trusted-publishing-capable version
        # OIDC trusted publishing needs npm >= 11.5.1; Node images float their
        # bundled npm. Floor it explicitly (floating tool defaults broke the
        # first v1.2.0 release cut — don't repeat that with npm).
        run: |
          npm install -g npm@^11.5.1
          npm --version
      - run: npm ci
      - name: Build the kernel (exports point at dist/)
        run: npm run build:proof
      - run: npm run typecheck
      - name: Conformance + verifier tests (vectors byte-for-byte)
        run: npm run test
      - name: Tag ↔ package version guard
        if: github.event_name == 'push'
        run: |
          PKG="$(node -p "require('./packages/proof/package.json').version")"
          TAG="${GITHUB_REF_NAME#proof-v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag proof-v${TAG} does not match packages/proof version ${PKG}"
            exit 1
          fi
      - name: Publish to npm (dry-run on dispatch)
        working-directory: packages/proof
        # --provenance=false while this repo is private — npm provenance
        # requires public source. Flip to true in the same commit as the
        # repo's public flip (P5 / D1).
        run: npm publish --provenance=false --access public ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
